[project]
name = "gpu-info"
version = "0.1.0"
description = "Local NVIDIA GPU telemetry dashboard"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.135.2",
  "nvidia-ml-py>=13.595.45",
  "psutil>=7.2.2",
  "pywin32>=306; sys_platform == 'win32'",
  "uvicorn>=0.42.0",
  "websockets>=16.0",
  "wmi>=1.5.1; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
  "flake8>=7.3.0",
  "mypy>=1.18.0",
]

[tool.mypy]
exclude = "(^\\.venv/|^frontend/)"

[[tool.mypy.overrides]]
module = ["pynvml", "psutil", "pythoncom", "wmi"]
ignore_missing_imports = true
